name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            asset: ponto-linux-x64
            native_pkg: "@opentui/core-linux-x64"
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset: ponto-linux-arm64
            native_pkg: "@opentui/core-linux-arm64"
          - target: bun-darwin-x64
            runner: macos-13
            asset: ponto-darwin-x64
            native_pkg: "@opentui/core-darwin-x64"
          - target: bun-darwin-arm64
            runner: macos-latest
            asset: ponto-darwin-arm64
            native_pkg: "@opentui/core-darwin-arm64"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install native package for target
        run: bun add ${{ matrix.native_pkg }}

      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} --define 'PONTO_VERSION="${{ github.ref_name }}"' index.ts --outfile ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
